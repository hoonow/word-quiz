<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>영단어 시험</title>
<style>
:root{--ink:#2b2520;--paper:#faf6ee;--card:#fffdf8;--rust:#c1502e;--navy:#3a4d6b;--line:#e6ddc9;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:'Georgia',serif;background:var(--paper);color:var(--ink);}
.wrap{max-width:520px;margin:0 auto;padding:48px 18px;}
.emoji{font-size:2.4rem;text-align:center;}
h1{font-size:1.5rem;text-align:center;margin:8px 0 4px;}
p.sub{text-align:center;color:#8a7f6a;margin:0 0 28px;font-size:.9rem;}
.week-list{display:flex;flex-direction:column;gap:12px;}
.week-card{display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:18px 20px;text-decoration:none;color:var(--ink);font-weight:bold;font-size:1.1rem;
  transition:border-color .15s,transform .1s;}
.week-card:hover{border-color:var(--rust);}
.week-card:active{transform:scale(.98);}
.week-card .arrow{color:var(--rust);font-size:1.2rem;}
</style>
</head>
<body>
<div class="wrap">
  <div class="emoji">📝</div>
  <h1>영단어 시험</h1>
  <p class="sub">주차를 선택하세요</p>
  <div class="week-list">
    <a class="week-card" href="week1.html">Week 1 <span class="arrow">→</span></a>
    <a class="week-card" href="week2.html">Week 2 <span class="arrow">→</span></a>
    <!-- 새 주차가 생기면 여기에 카드를 추가하세요: <a class="week-card" href="week3.html">Week 3 <span class="arrow">→</span></a> -->
  </div>
</div>
</body>
</html>
